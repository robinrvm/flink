# Temporary workflow (do not merge): runs the tests affected by FLINK-40886
# repeatedly, before and after the fix.

name: "FLINK-40886 loop"

on:
  push:
    branches:
      - 'rbn/FLINK-40886-loop'

permissions: read-all

jobs:
  loop:
    name: "${{ matrix.variant }} shard ${{ matrix.shard }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
        shard: [1, 2, 3, 4, 5]
    env:
      RUNS: 1
      TEST: 'BlobLibraryCacheManagerTest#testApplicationLevelJarSharing+testDifferentApplicationsNotSharing'
    steps:
      - uses: actions/checkout@v7
        with:
          # before = master at the branch point, after = the fix commit
          ref: ${{ matrix.variant == 'before' && 'a47e4bf9b9ef287d5ff7f5783df993e4cef2dd1a' || 'e8f29e93d7df8dc6d0fb879f946add582e99fad5' }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Build flink-runtime and its dependencies
        run: ./mvnw -B install -pl flink-runtime -am -DskipTests -Dfast -Pskip-webui-build -Djdk17 -Pjava17-target
      - name: Run the tests ${{ env.RUNS }} times
        run: |
          failed=0
          for i in $(seq 1 "$RUNS"); do
            if ./mvnw -B -o -q surefire:test -pl flink-runtime -Dtest="$TEST" -Djdk17 -Pjava17-target; then
              echo "run $i: passed"
            else
              echo "run $i: FAILED"
              failed=$((failed + 1))
              cp -r flink-runtime/target/surefire-reports "reports-run-$i"
            fi
          done
          echo "${{ matrix.variant }} shard ${{ matrix.shard }}: $failed of $RUNS runs failed" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports-${{ matrix.variant }}-${{ matrix.shard }}
          path: reports-run-*
